spring.application.name=StaffAppointmentPortal
server.port=8080

# MySQL DataSource (auto-creates appointment_portal database if it does not exist)
spring.datasource.url=jdbc:mysql://localhost:3306/appointment_portal?createDatabaseIfNotExist=true&useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=UTC
spring.datasource.username=root
spring.datasource.password=your_password_here
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# JPA & Hibernate
spring.jpa.hibernate.ddl-auto=update
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.MySQLDialect
spring.jpa.show-sql=false
spring.jpa.open-in-view=true

# Development mode: disable Thymeleaf cache for immediate reload
spring.thymeleaf.cache=false
spring.web.resources.cache.period=0
