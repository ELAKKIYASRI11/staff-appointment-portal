<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>Admin Dashboard</title>
    <link rel="stylesheet" th:href="@{/css/style.css}">
</head>
<body>
<div class="page-wrap">
    <div class="card">
        <div class="topbar">
            <div>
                <div style="font-weight:700; font-size:20px;">⚙️ Admin Dashboard</div>
                <div class="subtitle" style="margin:2px 0 0;">System overview and management</div>
            </div>
            <a class="btn btn-outline btn-small" th:href="@{/logout}">Logout</a>
        </div>
    </div>

    <!-- Image 5: top stats -->
    <div style="display:flex; gap:16px;">
        <div class="card stat-card" style="flex:1;">
            <div class="stat-emoji">🗓️</div>
            <div class="stat-num" th:text="${totalAppointments}">156</div>
            <div class="stat-label">Total Appointments</div>
        </div>
        <div class="card stat-card" style="flex:1;">
            <div class="stat-emoji">⭐</div>
            <div class="stat-num" th:text="${avgRating}">4.8</div>
            <div class="stat-label">Avg Rating</div>
        </div>
    </div>

    <!-- Image 6: per-staff breakdown -->
    <div class="card">
        <div class="section-label">Faculty Overview</div>
        <div class="staff-card" th:each="staff : ${staffList}">
            <div>
                <div class="role-title" th:text="${staff.name}">Prof. James Miller</div>
                <div class="role-sub" th:text="${staff.department != null ? staff.department.name : ''}">Mathematics</div>
            </div>
            <div style="text-align:right;">
                <div th:text="(${countsByStaff.get(staff.id)} ?: 0) + ' appointments'">35 appointments</div>
                <span class="badge badge-completed" th:text="${staff.avgRating} + '★'">4.5★</span>
            </div>
        </div>
    </div>

    <!-- Image 6: Flagged Appointments -->
    <div class="card">
        <div class="topbar">
            <div>
                <div class="section-label" style="margin-bottom:2px;">Flagged Appointments</div>
                <div class="role-sub">Appointments requiring attention</div>
            </div>
            <form th:action="@{/admin/check-overdue}" method="post">
                <button type="submit" class="btn btn-outline btn-small">Check now</button>
            </form>
        </div>

        <div class="flag-card" th:each="appt : ${flagged}">
            <div>
                <div class="role-title" th:text="${appt.student.name}">John Smith</div>
                <div class="role-sub" th:text="${#temporals.format(appt.createdAt, 'yyyy-MM-dd HH:mm')}">2024-02-15 14:00</div>
            </div>
            <form th:action="@{'/admin/flagged/' + ${appt.id} + '/resolve'}" method="post">
                <button type="submit" class="btn btn-outline btn-small">Review</button>
            </form>
        </div>

        <p class="subtitle" th:if="${#lists.isEmpty(flagged)}">Nothing flagged right now.</p>
    </div>
</div>
</body>
</html>
