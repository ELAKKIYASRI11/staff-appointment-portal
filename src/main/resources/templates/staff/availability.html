<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>My Availability</title>
    <link rel="stylesheet" th:href="@{/css/style.css}">
</head>
<body>
<div class="page-wrap">
    <div class="card">
        <div class="topbar">
            <div>
                <div style="font-weight:700; font-size:22px;">🧑‍🏫 Faculty Dashboard</div>
                <div class="subtitle" style="margin:2px 0 0;" th:text="'Logged in as ' + ${staffName}">Faculty</div>
            </div>
            <a class="btn btn-outline btn-small" th:href="@{/logout}">Logout</a>
        </div>

        <div class="tabs">
            <a class="tab" th:href="@{/staff/dashboard}">Appointment Requests</a>
            <span class="tab active">My Availability</span>
        </div>

        <!-- Success Alert -->
        <div class="alert alert-success" th:if="${success}" th:text="${success}"></div>
    </div>

    <!-- Add Availability Card -->
    <div class="card">
        <div class="section-label">Add New Availability Slot</div>
        <form th:action="@{/staff/availability/add}" method="post">
            <label>Day of Week</label>
            <select name="dayOfWeek" required>
                <option value="">-- Select Day --</option>
                <option value="MONDAY">Monday</option>
                <option value="TUESDAY">Tuesday</option>
                <option value="WEDNESDAY">Wednesday</option>
                <option value="THURSDAY">Thursday</option>
                <option value="FRIDAY">Friday</option>
                <option value="SATURDAY">Saturday</option>
            </select>

            <label>Time Slot (e.g. 10:00, 14:00)</label>
            <input type="time" name="timeSlot" required>

            <button type="submit" class="btn btn-green btn-block">Add Availability Slot</button>
        </form>
    </div>

    <!-- Active Slots Card -->
    <div class="card" th:if="${!#lists.isEmpty(slots)}">
        <div class="section-label">Your Scheduled Slots</div>
        <div th:each="slot : ${slots}" class="staff-card">
            <div>
                <span class="role-title" th:text="${slot.dayOfWeek}">MONDAY</span>
                <span style="margin:0 6px; color:#94a3b8;">•</span>
                <span class="role-sub" style="font-weight:600; color:#1e1e2d;" th:text="${slot.timeSlot}">14:00</span>
            </div>
            <span th:text="${slot.booked} ? 'Booked' : 'Open'"
                  th:classappend="${slot.booked} ? 'badge badge-accepted' : 'badge badge-pending'"></span>
        </div>
    </div>

    <div class="card center" th:if="${#lists.isEmpty(slots)}">
        <p class="subtitle" style="margin-bottom:0;">You haven't defined any availability slots yet. Add one above.</p>
    </div>
</div>
</body>
</html>
