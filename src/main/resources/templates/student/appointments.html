<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>My Appointments</title>
    <link rel="stylesheet" th:href="@{/css/style.css}">
</head>
<body>
<div class="page-wrap">
    <div class="card">
        <div class="topbar">
            <div>
                <div style="font-weight:700; font-size:22px;">🎓 Student Dashboard</div>
                <div class="subtitle" style="margin:2px 0 0;" th:text="'Logged in as ' + ${studentName}">Student</div>
            </div>
            <a class="btn btn-outline btn-small" th:href="@{/logout}">Logout</a>
        </div>

        <div class="tabs">
            <a class="tab" th:href="@{/student/dashboard}">Browse Faculty</a>
            <span class="tab active">My Appointments</span>
        </div>

        <!-- Success Alert -->
        <div class="alert alert-success" th:if="${success}" th:text="${success}"></div>
    </div>

    <!-- Appointments list -->
    <div class="card appt-card" th:each="appt : ${appointments}" style="display:block;">
        <div style="display:flex; justify-content:space-between; align-items:flex-start;">
            <div>
                <span class="role-title" style="font-size:16px;" th:text="${appt.staff.name}">Dr. Sarah Johnson</span>
                <span class="badge"
                      th:classappend="${'badge-' + #strings.toLowerCase(appt.status)}"
                      th:text="${appt.status}">PENDING</span>
                <div class="role-sub" th:text="${appt.staff.department != null ? appt.staff.department.name : ''}">Computer Science</div>
            </div>
            <div style="text-align:right;">
                <div class="role-sub" th:if="${appt.availability != null}" th:text="${appt.availability.dayOfWeek} + ' ' + ${appt.availability.timeSlot}">MONDAY 14:00</div>
                <div class="role-sub" th:text="${#temporals.format(appt.createdAt, 'yyyy-MM-dd HH:mm')}">2026-09-09 11:30</div>
            </div>
        </div>

        <div style="margin-top:10px;">
            <div style="font-size:14px;"><strong>Purpose:</strong> <span th:text="${appt.purpose}">Doubt clearing</span></div>
            <div th:if="${appt.remarks != null and !appt.remarks.isEmpty()}" style="font-size:13px; color:#475569; margin-top:4px;">
                <strong>Faculty Remarks:</strong> <span th:text="${appt.remarks}">Discussed chapter 4</span>
            </div>
        </div>

        <!-- Rating Section for Completed Appointments -->
        <div th:if="${appt.status.name() == 'COMPLETED' and appt.rating == null}" style="margin-top:14px; padding-top:12px; border-top:1px dashed #e2e8f0;">
            <form th:action="@{/student/rate}" method="post" style="display:flex; gap:10px; align-items:center;">
                <input type="hidden" name="appointmentId" th:value="${appt.id}">
                <label style="margin:0; font-size:13px; white-space:nowrap;">Rate Session:</label>
                <select name="rating" style="width:auto; margin:0; padding:6px 12px;">
                    <option value="5">⭐⭐⭐⭐⭐ (5 - Excellent)</option>
                    <option value="4">⭐⭐⭐⭐ (4 - Very Good)</option>
                    <option value="3">⭐⭐⭐ (3 - Good)</option>
                    <option value="2">⭐⭐ (2 - Fair)</option>
                    <option value="1">⭐ (1 - Poor)</option>
                </select>
                <button type="submit" class="btn btn-small">Submit Rating</button>
            </form>
        </div>

        <div th:if="${appt.rating != null}" style="margin-top:10px; padding-top:8px; border-top:1px dashed #e2e8f0; font-size:13px; color:#1e1e2d;">
            Your Rating: <span class="rating-stars" th:text="${appt.rating} + ' ★'">5 ★</span>
        </div>
    </div>

    <div class="card center" th:if="${#lists.isEmpty(appointments)}">
        <p class="subtitle" style="margin-bottom:0;">You have not booked any appointments yet.</p>
    </div>
</div>
</body>
</html>
