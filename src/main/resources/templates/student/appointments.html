<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>My Appointments</title>
    <link rel="stylesheet" th:href="@{/css/style.css}">
</head>
<body>
<div class="page-wrap">
    <div class="card">
        <div class="topbar">
            <div>
                <div style="font-weight:700; font-size:20px;">🎓 Student Dashboard</div>
                <div class="subtitle" style="margin:2px 0 0;">Book and manage your appointments</div>
            </div>
            <a class="btn btn-outline btn-small" th:href="@{/logout}">Logout</a>
        </div>

        <div class="tabs">
            <a class="tab" th:href="@{/student/dashboard}">Browse Faculty</a>
            <span class="tab active">My Appointments</span>
        </div>
    </div>

    <div class="card appt-card" th:each="appt : ${appointments}" style="display:block;">
        <div style="display:flex; justify-content:space-between;">
            <div>
                <span class="role-title" th:text="${appt.staff.name}">Dr. Sarah Johnson</span>
                <span class="badge"
                      th:classappend="${'badge-' + #strings.toLowerCase(appt.status)}"
                      th:text="${appt.status}">PENDING</span>
            </div>
        </div>
        <div class="role-sub" th:text="${appt.purpose}">Thesis Discussion</div>
        <div class="role-sub" th:text="${#temporals.format(appt.createdAt, 'yyyy-MM-dd HH:mm')}">2024-02-15</div>

        <div th:if="${appt.status.name() == 'COMPLETED' and appt.rating == null}" style="margin-top:12px;">
            <form th:action="@{/student/rate}" method="post" style="display:flex; gap:8px; align-items:center;">
                <input type="hidden" name="appointmentId" th:value="${appt.id}">
                <select name="rating" style="width:auto; margin:0;">
                    <option value="5">5 ★</option>
                    <option value="4">4 ★</option>
                    <option value="3">3 ★</option>
                    <option value="2">2 ★</option>
                    <option value="1">1 ★</option>
                </select>
                <button type="submit" class="btn btn-small">Rate</button>
            </form>
        </div>
        <div th:if="${appt.rating != null}" class="role-sub" style="margin-top:8px;">
            Your rating: <span th:text="${appt.rating}">5</span>★
        </div>
    </div>

    <div class="card center" th:if="${#lists.isEmpty(appointments)}">
        <p class="subtitle">You have no appointments yet.</p>
    </div>
</div>
</body>
</html>
